name: Registry smoke
on:
  workflow_dispatch:
    inputs:
      source:
        type: choice
        default: registry
        options: [registry, local]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, ubuntu-24.04, macos-14]
        node: ['18.20.8', '22']
    runs-on: ${{ matrix.os }}
    env:
      INSTALLER_SPEC: "@ade-syofyan/feature-map-pro@0.23.0-pro.2"
      FM_PRO_LICENSE_DIR: ${{ github.workspace }}/.registry-smoke/license
      CODEX_HOME: ${{ github.workspace }}/.registry-smoke/codex
      FEATURE_MAP_PRO_HOME: ${{ github.workspace }}/.registry-smoke/cache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Pack local candidate before registry publication
        if: inputs.source == 'local'
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          echo "INSTALLER_SPEC=$RUNNER_TEMP/ade-syofyan-feature-map-pro-0.23.0-pro.2.tgz" >> "$GITHUB_ENV"
      - name: Public CLI help
        shell: bash
        working-directory: ${{ runner.temp }}
        run: npx --yes --package="$INSTALLER_SPEC" -- feature-map-pro --help
      - name: New native commands are available
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes --package="$INSTALLER_SPEC" -- feature-map-pro rule-record --help
          npx --yes --package="$INSTALLER_SPEC" -- feature-map-pro task-brief --help
          npx --yes --package="$INSTALLER_SPEC" -- feature-map-pro task-resume --help
      - name: Public engine must reject missing licenses
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set +e
          npx --yes --package="$INSTALLER_SPEC" -- feature-map-pro license status > status.txt 2>&1
          result=$?
          set -e
          cat status.txt
          test "$result" -eq 2
          grep -q 'Pro belum aktif' status.txt
          node -e "const fs=require('fs'),path=require('path');if(fs.existsSync(path.join(process.env.CODEX_HOME,'skills')))process.exit(1)"
